name: Feature request
description: Suggest an idea or a new agent platform
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like it to work. Mockups or example prompts are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=spec 2>&1 | tee test-output.txt
      - name: Show failing tests as an annotation
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E -A 25 "✖|not ok" test-output.txt | head -120 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing tests on Node ${{ matrix.node }}::${msg:-no failure lines found; see the log}"
      - name: Check every module parses
        shell: bash
        run: for f in bin/*.mjs src/*.mjs src/hub/*.mjs scripts/*.mjs statusbar-extension/extension.js; do node --check "$f"; done
      - name: Build the extension (compiles the dashboard script)
        run: npm run build:extension
      - name: Upload the extension
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: claude-agent-hub-vsix
          path: dist/*.vsix
